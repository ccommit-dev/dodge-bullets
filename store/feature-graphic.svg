<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Play Console 그래픽 이미지 1024×500 -->
  <defs>
    <linearGradient id="fgbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132a44"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="fgblade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.45" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="fgguard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fgarrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fda4af"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#fgbg)"/>
  <circle cx="810" cy="250" r="200" fill="none" stroke="#5eead4" stroke-opacity="0.12" stroke-width="18"/>
  <circle cx="810" cy="250" r="150" fill="none" stroke="#5eead4" stroke-opacity="0.09" stroke-width="10"/>

  <!-- 우측 마크: 검 + 화살 -->
  <g>
    <path d="M690 340 L960 290" stroke="url(#fgarrow)" stroke-width="18" stroke-linecap="round"/>
    <path d="M960 290 l-38 -6 m38 6 l-32 22" stroke="#fda4af" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M660 128 L942 92" stroke="url(#fgarrow)" stroke-width="18" stroke-linecap="round"/>
    <path d="M942 92 l-38 -4 m38 4 l-33 21" stroke="#fda4af" stroke-width="15" fill="none" stroke-linecap="round"/>

    <path d="M810 60 L845 148 L837 320 L783 320 L775 148 Z" fill="url(#fgblade)"/>
    <path d="M810 60 L810 320" stroke="#0f766e" stroke-width="8" stroke-opacity="0.55"/>
    <rect x="748" y="312" width="124" height="28" rx="13" fill="url(#fgguard)"/>
    <rect x="795" y="338" width="30" height="72" rx="12" fill="#334155"/>
    <circle cx="810" cy="424" r="21" fill="url(#fgguard)"/>
    <circle cx="810" cy="424" r="9" fill="#7c2d12"/>
    <circle cx="810" cy="60" r="8" fill="#ecfeff"/>
  </g>

  <!-- 좌측 타이포 -->
  <g font-family="'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
    <text x="72" y="200" fill="#e6f7f2" font-size="86" font-weight="800" letter-spacing="2">DODGE LAB</text>
    <text x="74" y="258" fill="#5eead4" font-size="30" font-weight="700">피하고 · 벼리고 · 새기는 방치 액션</text>
    <g font-size="22" font-weight="600" fill="#94a3b8">
      <text x="74" y="322">⚔ 방치 사냥터</text>
      <text x="264" y="322">🏹 화살 원정</text>
      <text x="436" y="322">🔨 무한 재련</text>
      <text x="74" y="362">🥁 비트 수련</text>
      <text x="264" y="362">🌊 주간 랭크 시험</text>
    </g>
    <text x="74" y="430" fill="#64748b" font-size="19">오프라인 · 회원가입 없음 · 광고 없음</text>
  </g>
</svg>
