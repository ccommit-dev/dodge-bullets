# 총피하기 온라인 서버 — 접속자 · 채팅 · 랭킹 (Cloudflare Workers + Durable Object 하나)
# 배포: GitHub Actions(.github/workflows/server.yml)가 server/** 가 바뀌면 자동으로. 로컬: cd server && npm ci && npm run dev
name = "dodge-bullets-online"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
send_metrics = false

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# 무료 플랜은 SQLite 저장 Durable Object 만 된다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[vars]
# 채팅 끄기 스위치 — "false" 면 채팅만 막는다(랭킹 · 접속자는 그대로)
CHAT_ENABLED = "true"
# WebSocket 을 받는 게임 주소(쉼표). localhost · 127.0.0.1 은 포트 상관없이 늘 허용(개발)
ALLOWED_ORIGINS = "https://ccommit-dev.github.io"
