name: Android Build

# 웹 소스나 안드로이드 프로젝트가 바뀔 때마다 debug APK를 빌드해 아티팩트로 올린다.
# 로컬 빌드 환경(JDK 21 + SDK + 사내망 TLS 우회) 없이도 누구나 APK를 받을 수 있다.
#
# release .aab 서명까지 CI로 옮기려면 (선택):
#   1) Settings > Secrets에 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 등록
#   2) 아래 "Decode keystore" 스텝의 주석을 해제
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web and sync to native
        run: npm run native:sync

      # - name: Decode keystore (release 서명 시 주석 해제)
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/dodgelab-upload.keystore
      #     cat > android/key.properties <<EOF
      #     storeFile=../dodgelab-upload.keystore
      #     storePassword=${{ secrets.KEYSTORE_PASSWORD }}
      #     keyAlias=${{ secrets.KEY_ALIAS }}
      #     keyPassword=${{ secrets.KEY_PASSWORD }}
      #     EOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodgelab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
