name: Deploy Grow a Beaver to GitHub Pages

# 2026-10-29: 사이트는 저장소 Pages 설정의 브랜치 배포(main /docs → "pages-build-deployment")가 올린다.
# 이 워크플로까지 푸시마다 같은 docs/ 를 배포하면 두 배포가 잠금을 다퉈 "in progress deployment" 로 꾸준히 실패했다(#213).
# 그래서 손으로만 — 브랜치 배포가 멈췄을 때 Actions 탭에서 Run workflow 로 같은 docs/ 를 다시 올리는 비상용
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      # 2026-10-27 #213: 기본 "pages-build-deployment"(브랜치 배포)가 같은 배포 잠금을 잡고 있으면
      # "Deployment request failed … due to in progress deployment" 로 거절된다(위 concurrency 는 이 워크플로끼리만 막는다).
      # 그때는 그 배포가 끝나길 기다렸다 한 번 더 — 사이트는 같은 docs/ 라 결과는 같다
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for the in-progress deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
